# Server config for the tharlei.com SPA.
# Mounted at /etc/nginx/conf.d/default.conf inside the nginx-unprivileged image.

server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version.
    server_tokens off;

    # ---- Security headers (inherited by every location below, because none
    #      of them declare their own add_header — they use `expires` only,
    #      which does not reset inherited headers). ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.simpleicons.org https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://api.country.is https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ---- Compression ----
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # Never cache the app shell, so a new deploy is picked up immediately.
    location = /index.html {
        expires -1;
    }

    # Vite fingerprints asset filenames (content hash) -> cache them hard.
    location /assets/ {
        expires    1y;
        access_log off;
        try_files  $uri =404;
    }

    # SPA routing: serve the file if it exists, otherwise fall back to the
    # app shell so client-side routes (react-router) resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /robots.txt { access_log off; log_not_found off; }
    location = /favicon.svg { access_log off; log_not_found off; }
}
